<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         }

          body{
            background-color: azure;
            text-align: center;
            
        }
         
    header{
        padding: 15px 10px;
        
        display: flex;
        justify-content: space-between;

        align-items: center;
        position: fixed;
        top: 0;
        width: 100%;
        background-color: black;

        color: white;
    }

    nav a{
        color: white;
        text-decoration: none;
        justify-content: space-between;
        padding: 10px 10px;
    }



    .hero{
        margin-top: 50px;
        background-color: antiquewhite;
        height: 200px;

        display: flex;
        justify-content: center;

        align-items: center;
    }
        
    
    
        li{
        display: inline-block;


        
        }
        .first{
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .second{
          text-align: left;
          background-color: blue; 
          width: 400px; 
          height: 200px;
          gap: 10px;
        }
        .figure{
            height: 200px;
            background-color: brown;
            width: 700px;
            gap: 10px;
        }
        .third{
             display: flex;
            gap: 19px;
            margin-bottom: 10px;
        }
        .fourth{
           background-color: blueviolet; 
           flex-grow: 1;
           display: flex;
           gap: 15px;
           padding: 30px 30px;
           
        }
        .fifth{
            background-color: burlywood;
            flex-grow: 1;
            padding: 30px 30px;
            margin-bottom: 10px;
            
        }
        .sixth{
            background-color: chartreuse;
            flex-grow: 1;
            padding: 30px 30px;
            margin-bottom: 10px;
        }
        .seventeen{ 
              display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .eighteen{
          background-color: peru;
          width: 300px;  
          height: 100px;
          gap: 6px;
        }
        .nineteen{
        background-color: gray;
        width: 600px;
        height: 100px;
        gap: 7px;
        }
        .Ten{
            background-color: yellow;
            width: 300px;
            gap: 8px;
        }
        .Twelve{
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .Tetten{
            background-color: green;
            width: 200px;
            height: 100px;

        }
        .Fourteen{
            background-color: gold;
            width: 200px;
            height: 100px;
        }
        .Fifteen{
            background-color: aquamarine;
            width: 200px;
            
         }
         .Good{
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
         }
         .flex{
            background-color: pink;
            width: 400px;
            height: 100px;
         }
         .class{
            background-color: crimson;
            width: 400px;
            height: 100px;
         }
         .submit{
            background-color: blue;
        
         }
         a{
            text-align: left;
         }
        

    </style>
 
</head>
<body>
    <header>
        <h3>LOGO</h3>
    
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
            
        </nav>
    </header>

    <section class="hero">
        <div>
            <h2>Learn Web Development With Us</h2>
            <ul>
                <li>Build.</li>
                <li>Learn.</li>
                <li>Grow.</li>
            </ul>
        </div>
    </section>
        

    <section class="first">
        <aside class="second">SIDEBAR</aside>
        <main class="figure">MAIN CONTENT</main>
    </section>

    
    <div class="third">
        <div class="fourth">CARD 1</div>
        <div class="fifth">CARD 2</div>
        <div class="sixth">CARD 3</div> 
    </div>

    
    <div class="seventeen"> 
        <div class="eighteen">LEFT</div>
        <div class="nineteen">CENTER</div>
        <div class="Ten">RIGHT</div>
    </div>

    <div class="Twelve">
        <div class="Tetten">GALLERY 1</div>
        <div class="Fourteen">GALLERY 2</div>
        <div class="Fifteen">GALLERY 3</div>
        <div class="sixth">GALLERY 4</div>
    </div>

    <div class="Good">
        <div class="flex">GALLERY 5</div>
        <div class="class">GALLERY 6</div>
    </div>


    <footer>
        <h3 class="submit">FOOTER</h3>
    </footer>    

    
</body>
