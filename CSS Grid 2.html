<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .gridContainer1{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }
        .gridContainer1 .box{
            background-color: forestgreen;
        }

        .box1{
            /* grid-column: 1/3; */
            /* start at line 1 */
            /* end at line 3 */
            
            grid-row: 1/3;

            /* span keyword */
            /* instead of counting ending lines, use span */
        }
        .box2{
            grid-column: 2/4;
        }
        
    </style>
</head>
<body>
    <h2>CSS GRID</h2>

    <h2>Positioning items in a Grid</h2>
    <p>In the previous lesson, we learned how to create row and column</p>
    <p>Now we'll learn how to control where each item sits inside the grid container.</p>
     
     <h3>grid-column</h3>
      <p>It moves an item across across columns</p>

      <h3>grid-row</h3>
      <p>works exactly the same but vertically.</p>
    <section class="gridContainer1">
        <div class="box box1">1</div>
        <div class="box box2">2</div>    
        <div class="box box3">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </section>

</body>
</html>
