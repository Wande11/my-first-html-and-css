    <title>Document</title>
    <style>
        .box{
        width: 200px;
      padding: 20px;
       margin: 20px;
      border: solid;
      background-color: var(--green);
      height: 200px;
    }
    .circle{

        height: 200px;
        background-color: var(--green);
        border-radius: 50%;
        margin: 20px;
        padding: 20px;
        text-align: center;
        border: 5px solid black;
    }

  /* Style only the top border */
  border-top:    4px solid red;

  /* Style only the bottom border */
  border-bottom: 4px dashed blue;

  /* Style only the left border */
  border-left:   6px solid green;

  /* Style only the right border */
  
  

    
  
    </style>
</head>
<body>
    <div class="box">
        <p>this is my box</p>
    </div>
    <div class="circle">
        <p>this is my circle</p>
    </div>
</body>
</html>
