<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
           width:100px;
           height:100px;
           margin: 10px;
          /* border: 20px solid red; */
        }
        .Dashed{
            border-style:  dashed;
            border-width: 20px;
            border-color: aqua;
        }
        .Dotted{
            border-style: dotted;
            border-width: 10px;

        }
        .Solid{
            border-style: solid;
            border-width: 10px;
        }
        .Double{
            border-style: double;
            border-width: 15px;
        }
        .groove{
            border-style: groove;
            border-width: 20px;
        }
        .ridge{
            border-style: ridge;
            border-width: 21px;
        }
        .inset{
            border-style: inset;
            border-width: 24px;
        }
        .outset{
            border-style: outset;
            border-width: 30px;
        }
        .DDSD{
            border-style: Dotted Dashed Solid Double;
    
        }
    </style>
</head>
<body>
    <h1>CSS BORDERS</h1>
    <p>CSS Border Style : It specifies what kind of border to display</p>

    <div class="Dashed">Dashed Border style</div>
    <div class="Dotted">Dotted Border style</div>
    <div class="Solid">Solid Border Style</div>
    <div class="Double">Double Border style</div>
    <div class="groove">groove Border style</div>
    <div class="ridge">ridge Border style</div>
    <div class="inset"> inset Border style</div>
    <div class="outset"> outset Border style</div>
    <div class="DDSD">Dotted Dashed Solid Double Border style</div>
</body>
</html>
