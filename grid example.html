<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 80px 200px 80px ;
            gap: 10px;
            height: 100vh;
        }
        header{
            background-color: aquamarine;
            grid-column: 1/-1;
            display: grid;
            place-items: center;
            
            
        }
        aside{
            background-color: palevioletred ;
            display: flex;
            place-items: center;
        }
        footer{
            background-color: crimson;
            grid-column: 1/-1;
            display: grid;
            place-items: center;
            
        }
        main{
            background-color:blue;
            grid-column: 1/3;

            /* Center Item using grid */
            display: flex;
            place-items: center;
        }
        .hero{
            background-color: darkkhaki;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
    </style>
</head>
<body>
    <header>
        <h1>HEADER</h1>
    </header>


    <aside>
         <h1>SIDEBAR</h1>
    </aside>


    <section class="hero">
        <h1>HERO SECTION</h1>
    </section>

     <main>
        <h1>MAIN CONTENT</h1>
     </main>


    <footer>
        <h1>FOOTER</h1>
    </footer>
</body>
</html>
