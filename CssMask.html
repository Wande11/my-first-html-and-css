<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
            body{
                background-color: black;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                padding: 20px;
            }
            .masked-text{
                font-size: 200px;
                background: url('download-removal-preview (5).png') center/cover;

                /* use text as a mask  */
                -webkit-text-fill-color: transparent;
                -webkit-background-clip: text;
            }
        
    </style>
</head>
<body>
   <h1>CSS Masking</h1> 
   <h1 class="masked-text">HELLO</h1>
   <!-- <img src="download-removebg-preview (5).png" alt=""> -->
</body>
</html>
